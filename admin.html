<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموقع - Admin Dashboard</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #cbd5e1; }
        input[type="text"], textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 100px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; margin-top: 25px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #0369a1; }
        .success-msg { background: #065f46; color: #6ee7b7; padding: 10px; border-radius: 6px; margin-top: 15px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة تحكم الموقع السريعة</h1>
        <p>عدل البيانات دي براحتك، وبعدين اضغط "حفظ وتحميل الملف الجديد" وارفع ملف <code>data.json</code> مكان الملف القديم في مشروعك!</p>
        
        <form id="adminForm">
            <label>الاسم الرئيسي:</label>
            <input type="text" id="name" required>

            <label>المسمى الوظيفي (تحت الاسم):</label>
            <input type="text" id="subtitle" required>

            <label>رابط صورتك الشخصية:</label>
            <input type="text" id="profile_image" required>

            <label>رابط بيهانس (Behance):</label>
            <input type="text" id="behance">

            <label>رابط إنستجرام (Instagram):</label>
            <input type="text" id="instagram">

            <label>رابط واتساب (WhatsApp):</label>
            <input type="text" id="whatsapp">

            <h2>نبذة عني (About)</h2>
            <label>من أنا؟:</label>
            <textarea id="who"></textarea>

            <label>الخبرات والبرامج:</label>
            <textarea id="experience"></textarea>

            <h2>روابط صور الأعمال (Portfolio Images - افصل بينهم بـ Enter)</h2>
            <textarea id="projects" style="height: 150px; font-family: monospace;"></textarea>

            <button type="submit">💾 حفظ وتحميل ملف data.json الجديد</button>
            <div id="successMsg" class="success-msg">تم تجهيز الملف بنجاح! جاري التحميل...</div>
        </form>
    </div>

    <script>
        let currentData = {};
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                currentData = data;
                document.getElementById('name').value = data.name || '';
                document.getElementById('subtitle').value = data.subtitle || '';
                document.getElementById('profile_image').value = data.profile_image || '';
                document.getElementById('behance').value = data.behance || '';
                document.getElementById('instagram').value = data.instagram || '';
                document.getElementById('whatsapp').value = data.whatsapp || '';
                document.getElementById('who').value = data.about?.who || '';
                document.getElementById('experience').value = data.about?.experience || '';
                document.getElementById('projects').value = (data.projects || []).join('\n');
            })
            .catch(err => alert('تأكد من وجود ملف data.json في نفس المجلد!'));

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentData.name = document.getElementById('name').value;
            currentData.subtitle = document.getElementById('subtitle').value;
            currentData.profile_image = document.getElementById('profile_image').value;
            currentData.behance = document.getElementById('behance').value;
            currentData.instagram = document.getElementById('instagram').value;
            currentData.whatsapp = document.getElementById('whatsapp').value;
            currentData.about.who = document.getElementById('who').value;
            currentData.about.experience = document.getElementById('experience').value;
            currentData.projects = document.getElementById('projects').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 4));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "data.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();

            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 4000);
        });
    </script>
</body>
</html>
